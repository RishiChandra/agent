# Mosquitto broker (eclipse-mosquitto:2). deploy/mosquitto/ is mounted
# read-only at /mosquitto/config, so paths below are relative to that.
#
#   passwd       generated on the VM by deploy/deploy.sh from deploy/.env
#   acl          rendered on the VM by deploy/deploy.sh from acl.template + deploy/.env
#   certs/       Let's Encrypt cert copied in by certsync.sh (cron, 10 min)
#
# SIGHUP (docker kill -s HUP aipin-mosquitto) reloads passwd, acl and certs.

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Public listener: TLS only. Published as 8883 in docker-compose.yml.
# server.crt is Caddy's fullchain (leaf + intermediate), so no cafile is needed.
listener 8883
protocol mqtt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# Internal plaintext listener for the worker. NOT published in
# docker-compose.yml, so it is only reachable from containers on the compose
# network; the same password file + ACL apply.
listener 1883
protocol mqtt
